<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Models Catalog</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--tg-theme-bg-color, #1c1c1e);
  color: var(--tg-theme-text-color, #ffffff);
  padding-bottom: 20px;
}
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--tg-theme-header-bg-color, #2c2c2e);
  padding: 12px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.header h1 { font-size: 20px; font-weight: 600; }
.geo-tabs {
  display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px;
  background: var(--tg-theme-bg-color, #1c1c1e);
  scrollbar-width: none;
}
.geo-tabs::-webkit-scrollbar { display: none; }
.geo-tab {
  flex: 0 0 auto;
  padding: 8px 14px;
  background: var(--tg-theme-secondary-bg-color, #2c2c2e);
  color: var(--tg-theme-text-color, #fff);
  border-radius: 20px;
  font-size: 14px;
  cursor: pointer;
  border: none;
  white-space: nowrap;
}
.geo-tab.active {
  background: var(--tg-theme-button-color, #0a84ff);
  color: var(--tg-theme-button-text-color, #fff);
}
.search {
  margin: 0 16px 12px;
  padding: 10px 14px;
  border-radius: 12px;
  border: none;
  background: var(--tg-theme-secondary-bg-color, #2c2c2e);
  color: var(--tg-theme-text-color, #fff);
  font-size: 15px;
  width: calc(100% - 32px);
}
.list { padding: 0 16px; }
.card {
  background: var(--tg-theme-secondary-bg-color, #2c2c2e);
  border-radius: 16px;
  margin-bottom: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.1s;
}
.card:active { transform: scale(0.98); }
.card-photo {
  height: 180px;
  background: linear-gradient(135deg, #3a3a3c, #1c1c1e);
  display: flex; align-items: center; justify-content: center;
  color: #888; font-size: 14px;
  position: relative;
}
.card-body { padding: 14px; }
.card-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
.card-meta { font-size: 14px; color: var(--tg-theme-hint-color, #8e8e93); margin-bottom: 8px; }
.card-contacts { display: flex; gap: 8px; flex-wrap: wrap; }
.contact-btn {
  padding: 6px 12px;
  background: var(--tg-theme-button-color, #0a84ff);
  color: var(--tg-theme-button-text-color, #fff);
  border-radius: 8px;
  font-size: 13px;
  text-decoration: none;
  border: none;
  cursor: pointer;
}
.modal {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.6);
  align-items: flex-end; justify-content: center;
}
.modal.show { display: flex; }
.modal-content {
  background: var(--tg-theme-bg-color, #1c1c1e);
  width: 100%; max-height: 90vh; overflow-y: auto;
  border-radius: 20px 20px 0 0;
  padding: 20px;
}
.modal-close {
  float: right; font-size: 24px; cursor: pointer; color: #888;
}
.raw-text {
  white-space: pre-wrap; font-size: 14px; line-height: 1.5;
  margin-top: 12px; color: var(--tg-theme-text-color, #fff);
}
.empty { text-align: center; padding: 40px; color: #888; }
</style>
</head>
<body>
<div class="header">
  <h1>Models Catalog</h1>
</div>
<div class="geo-tabs" id="geoTabs"></div>
<input type="search" class="search" id="search" placeholder="Поиск по имени...">
<div class="list" id="list"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <span class="modal-close" id="closeModal">&times;</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor(tg.themeParams.bg_color || '#1c1c1e');
  document.body.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color || '#1c1c1e');
  document.body.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color || '#ffffff');
  document.body.style.setProperty('--tg-theme-secondary-bg-color', tg.themeParams.secondary_bg_color || '#2c2c2e');
  document.body.style.setProperty('--tg-theme-button-color', tg.themeParams.button_color || '#0a84ff');
  document.body.style.setProperty('--tg-theme-button-text-color', tg.themeParams.button_text_color || '#ffffff');
  document.body.style.setProperty('--tg-theme-hint-color', tg.themeParams.hint_color || '#8e8e93');
}

let MODELS = [];
let currentGeo = 'Все';
let searchQuery = '';

async function loadModels() {
  try {
    const res = await fetch('models.json');
    MODELS = await res.json();
    renderTabs();
    renderList();
  } catch (e) {
    document.getElementById('list').innerHTML = '<div class="empty">Ошибка загрузки данных</div>';
  }
}

function getGeos() {
  const geos = [...new Set(MODELS.map(m => m.geo))].sort((a,b) => {
    const order = ['Дубай','Москва','Пхукет','Тбилиси','Барселона','Бали','Алматы','Ереван','Батуми'];
    return (order.indexOf(a)===-1?99:order.indexOf(a)) - (order.indexOf(b)===-1?99:order.indexOf(b));
  });
  return ['Все', ...geos];
}

function renderTabs() {
  const container = document.getElementById('geoTabs');
  container.innerHTML = '';
  getGeos().forEach(geo => {
    const btn = document.createElement('button');
    btn.className = 'geo-tab' + (geo === currentGeo ? ' active' : '');
    btn.textContent = geo === 'Все' ? 'Все' : `${geo} (${MODELS.filter(m=>m.geo===geo).length})`;
    btn.onclick = () => { currentGeo = geo; renderTabs(); renderList(); };
    container.appendChild(btn);
  });
}

function filtered() {
  return MODELS.filter(m => {
    const geoOk = currentGeo === 'Все' || m.geo === currentGeo;
    const searchOk = !searchQuery || m.name.toLowerCase().includes(searchQuery.toLowerCase()) || m.raw.toLowerCase().includes(searchQuery.toLowerCase());
    return geoOk && searchOk;
  });
}

function renderList() {
  const list = document.getElementById('list');
  const items = filtered();
  if (!items.length) {
    list.innerHTML = '<div class="empty">Ничего не найдено</div>';
    return;
  }
  list.innerHTML = items.map(m => `
    <div class="card" onclick="openModal(${m.id})">
      <div class="card-photo">${m.media_count ? m.media_count + ' фото' : 'Нет фото'}</div>
      <div class="card-body">
        <div class="card-name">${m.name}</div>
        <div class="card-meta">${m.geo} · ${m.age} лет · ${m.height} см · ${m.weight} кг</div>
        <div class="card-contacts">
          ${m.tg ? `<span class="contact-btn" onclick="event.stopPropagation(); window.open('https://t.me/${m.tg.replace('@','')}')">${m.tg}</span>` : ''}
          ${m.wa ? `<span class="contact-btn" onclick="event.stopPropagation(); window.open('https://wa.me/${m.wa.replace(/[^0-9]/g,'')}')">${m.wa}</span>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

function openModal(id) {
  const m = MODELS.find(x => x.id === id);
  if (!m) return;
  document.getElementById('modalBody').innerHTML = `
    <h2 style="margin-bottom:8px">${m.name}</h2>
    <div class="card-meta">${m.geo} · ${m.age} лет · ${m.height} см · ${m.weight} кг</div>
    <div class="card-contacts" style="margin:12px 0">
      ${m.tg ? `<a class="contact-btn" href="https://t.me/${m.tg.replace('@','')}" target="_blank">${m.tg}</a>` : ''}
      ${m.wa ? `<a class="contact-btn" href="https://wa.me/${m.wa.replace(/[^0-9]/g,'')}" target="_blank">${m.wa}</a>` : ''}
    </div>
    <div class="raw-text">${m.raw}</div>
  `;
  document.getElementById('modal').classList.add('show');
}

document.getElementById('closeModal').onclick = () => document.getElementById('modal').classList.remove('show');
document.getElementById('modal').onclick = (e) => { if (e.target.id === 'modal') document.getElementById('modal').classList.remove('show'); };
document.getElementById('search').oninput = (e) => { searchQuery = e.target.value; renderList(); };

loadModels();
</script>
</body>
</html>
